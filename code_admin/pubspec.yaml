name: code_admin
description: "Aplikasi admin Konfeti (kelola event, check-in tiket, laporan)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

# Versi paket disamakan dengan code_konfeti supaya konfigurasi Android/Gradle yang sama langsung cocok.
dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.69.0
  flutter_secure_storage: ^11.2.0
  google_fonts: ^9.0.0
  http: ^1.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
